<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>无忧云笔记 · 登录</title>
    <link rel="stylesheet" href="./assets/tailwind.css" />
</head>
  <body class="min-h-screen bg-slate-100 text-slate-700">
    <main class="mx-auto flex min-h-screen max-w-5xl items-center justify-center px-4 py-10">
      <section id="loginPage" class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">无忧云笔记</h1>
        <p class="mt-1 text-sm text-slate-500">登录以领取年度 VIP 专属权益</p>
        <div class="mt-6 space-y-3">
          <div>
            <label class="text-xs text-slate-500">账号</label>
            <input id="cloudAccountInput" class="mt-2 h-10 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none" placeholder="用户名" />
          </div>
          <div>
            <label class="text-xs text-slate-500">密码</label>
            <input id="cloudPasswordInput" type="password" class="mt-2 h-10 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none" placeholder="请输入密码" />
          </div>
          <p id="cloudLoginFeedback" class="text-xs text-rose-600"></p>
          <button id="cloudLoginSubmit" class="mt-1 w-full rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white" type="button">
            登录
          </button>
          <button id="toggleRecoverBtn" class="w-full text-xs text-blue-600 hover:underline" type="button">找回密码</button>
          <a href="./mailbox.html?view=linlan" class="block text-center text-xs text-slate-500 hover:underline">返回邮箱</a>
        </div>
      </section>

      <section id="recoverPage" class="hidden w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-2xl font-bold text-slate-900">找回密码</h2>
        <p class="mt-1 text-sm text-slate-500">请验证身份信息后重置密码</p>
        <div class="mt-6 rounded-xl border border-slate-200 bg-slate-50 p-3">
          <p class="text-xs text-slate-500">输入真名</p>
          <input id="recoverRealNameInput" class="mt-1 h-10 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none" placeholder="请输入真名" />
          <p class="mt-2 text-xs text-slate-500">输入手机号</p>
          <input id="recoverPhoneInput" class="mt-1 h-10 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none" placeholder="请输入手机号" />
          <p class="mt-2 text-xs text-slate-500">找回方式</p>
          <select id="recoverMethodSelect" class="mt-1 h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm outline-none">
            <option value="email">邮箱找回</option>
          </select>
          <p id="recoverFeedback" class="mt-2 text-xs text-rose-600"></p>
          <button id="recoverSubmitBtn" class="mt-2 w-full rounded-lg bg-slate-800 px-4 py-2 text-sm text-white" type="button">提交找回</button>
          <button id="backToLoginBtn" class="mt-2 w-full text-xs text-blue-600 hover:underline" type="button">返回登录</button>
        </div>
      </section>
    </main>
    <script src="./progressTracker.js"></script>
    <script src="./page009Engine.js"></script>
  </body>
</html>
