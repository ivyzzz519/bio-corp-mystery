      <article class="mt-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-bold text-slate-900">锦旗传谢意：无限生物科技有限公司助力中年夫妇圆“父母梦”</h1>
        <p class="mt-2 text-sm text-slate-500">【来源：A城日报】</p>
        <div class="prose-article mt-4">
          <p class="prose-lead">本报讯（记者 孙建平）</p>
          <figure>
            <img
              src="./images/news4.png"
              alt="夫妇向张弛医生赠送锦旗"
              class="w-full rounded-xl border border-slate-200 object-cover shadow-sm"
            />
            <figcaption>夫妇向张弛医生赠送锦旗现场</figcaption>
          </figure>
          <p>
            近日，无限生物科技有限公司办公区内暖意融融。一对步入中年的夫妇将一面写有“医德高尚，圆梦生殖”的锦旗亲手交到张弛医生手中，以此表达全家最真挚的感激。
          </p>
          <p>
            据了解，该夫妇多年求子之路坎坷，面对高龄生育的重重挑战曾几近放弃。张弛医生及其医疗团队针对其身体状况，精准制定了辅助生殖技术方案。经过严谨的治疗与细致的心理疏导，两人近期终获圆满，成功晋升为新手父母。
          </p>
        </div>
      </article>
