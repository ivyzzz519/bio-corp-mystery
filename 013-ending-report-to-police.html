<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>结局 · 报案之后</title>
    <link rel="stylesheet" href="./assets/tailwind.css" />
    <style>
      @keyframes caret-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      .type-caret {
        display: inline-block;
        margin-left: 1px;
        color: rgb(52 211 153);
        font-weight: 300;
        animation: caret-blink 1.05s step-end infinite;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-4xl px-6 py-12">
      <div class="rounded-2xl border border-slate-700 bg-slate-900/70 p-8 shadow-2xl">
        <p class="text-xs tracking-[0.3em] text-slate-400">ENDING 01</p>
        <h1 class="mt-3 text-3xl font-bold text-white">你拿到录音，报了案。</h1>

        <div id="bodyTypingHost" class="prose-article prose-article--dark prose-article--compact mt-6 min-h-[6rem]"></div>

        <div id="actionRow" class="mt-8 hidden flex-col gap-3 sm:flex sm:flex-row sm:flex-wrap sm:items-center">
          <a
            id="hiddenEndingLink"
            href="./014-ending-shadow-archive.html#password=JXZZ60@WT11"
            class="inline-flex justify-center rounded-md border border-emerald-600/60 bg-emerald-950/40 px-4 py-2 text-sm font-medium text-emerald-200 hover:bg-emerald-900/50"
          >
            探索隐藏内容
          </a>
          <a
            id="homeLink"
            href="./001-oa-home.html"
            class="inline-flex justify-center rounded-md border border-slate-500 px-4 py-2 text-sm text-slate-200 hover:bg-slate-800"
          >
            返回首页
          </a>
        </div>
      </div>
    </main>

    <script src="./progressTracker.js"></script>
    <script>
      (function () {
        var home = document.getElementById("homeLink");
        if (home && window.GameProgressTracker && window.GameProgressTracker.resolveUrlWithStage) {
          home.href = window.GameProgressTracker.resolveUrlWithStage("./001-oa-home.html");
        }

        var BODY_PARAS = [
          "姐姐的案件被重启，当你们找到张弛时，他的尸体出现在的C市半地下室内，皮肤已脱落，成了一块干瘪的腐肉。",
          "他的身旁放着一封遗书，写着暗恋林岚不成，因爱生恨的俗套故事。",
          "至于用自己的精子混淆样本，将已出生的孩子送去殡仪馆，以及林岚的死，都是他一手促成的。",
          "死到临头，他感到愧疚，索性把自己的罪恶大白于天下。",
          "你感到愤怒，你为你的姐姐辩驳，但似乎除了你无人在意。",
          "毕竟他都已经死了，人们心中默念着，把你的辩驳和喊叫当做某种PTSD的外显，流露出一种“如果这样她能心情好些，就让她发疯”的表情。",
          "人死了，无限生物公司解散了。",
          "但你总觉得困顿、疑惑，闭眼是张弛对姐姐的污蔑，和别人表面安慰你实则把这当做可有可无的情绪付出。",
          "为了逃避烦闷的心情，你总是四处散心，在各个小乡村中乱走。",
          "然后有一天，你在附近市的小县城的公厕里，看到了一串小字：",
          "挣大钱 女大学生来   有限生物公司  1889900934"
        ];

        function wait(ms) {
          return new Promise(function (resolve) {
            setTimeout(resolve, ms);
          });
        }

        function attachCaret(paragraphEl) {
          var caret = document.createElement("span");
          caret.className = "type-caret";
          caret.textContent = "▍";
          paragraphEl.appendChild(caret);
          return caret;
        }

        function typeInto(paragraphEl, fullText, baseDelay) {
          return new Promise(function (resolve) {
            paragraphEl.innerHTML = "";
            var caret = attachCaret(paragraphEl);
            var i = 0;
            function tick() {
              if (i < fullText.length) {
                var ch = fullText.charAt(i);
                caret.before(document.createTextNode(ch));
                i += 1;
                var delay = baseDelay + Math.floor(Math.random() * 14);
                if (/[，。；、：！？“”——]/.test(ch)) {
                  delay += 55;
                }
                setTimeout(tick, delay);
              } else {
                if (caret.parentNode) caret.remove();
                resolve();
              }
            }
            tick();
          });
        }

        async function runBodyTyping() {
          var host = document.getElementById("bodyTypingHost");
          if (!host) return;
          host.innerHTML = "";
          for (var pi = 0; pi < BODY_PARAS.length; pi++) {
            var p = document.createElement("p");
            p.className = "";
            host.appendChild(p);
            await typeInto(p, BODY_PARAS[pi], 40);
            await wait(280);
          }
          var row = document.getElementById("actionRow");
          if (row) row.classList.remove("hidden");
        }

        function boot() {
          runBodyTyping();
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }

        var el = document.getElementById("hiddenEndingLink");
        if (el) {
          var raw = "./014-ending-shadow-archive.html#password=JXZZ60@WT11";
          el.addEventListener("click", function (e) {
            e.preventDefault();
            /** 同标签页若曾解锁过 014，boot 会直进归档；从结局1正式入口进入时应重走封停→终端→口令，故清除一次。地址栏仍带 #password= 作为玩法提示，不用于自动登录。 */
            try {
              sessionStorage.removeItem("game014_shadow_archive_unlocked");
            } catch (eUnlock) {}
            var url =
              window.GameProgressTracker && window.GameProgressTracker.resolveUrlWithStage
                ? window.GameProgressTracker.resolveUrlWithStage(raw)
                : raw;
            window.location.replace(url);
          });
        }
      })();
    </script>
  </body>
</html>
