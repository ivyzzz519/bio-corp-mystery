        function readShadowArchiveViewedIdMap() {
          try {
            var raw = localStorage.getItem(SHADOW_FILES_VIEWED_STORAGE_KEY) || "[]";
            var parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) {
              return {};
            }
            var map = {};
            for (var i = 0; i < parsed.length; i++) {
              var sid = String(parsed[i] || "").trim();
              if (sid) {
                map[sid] = true;
              }
            }
            return map;
          } catch (eViewed) {
            return {};
          }
        }

        function getDisplayedCollectedFiles() {
          var q = norm(fileKeywordInput && fileKeywordInput.value);
          var viewedMap = readShadowArchiveViewedIdMap();
          var openedIds = readOpenedArchiveIds();
          var openedMap = {};
          for (var oi = 0; oi < openedIds.length; oi++) {
            openedMap[openedIds[oi]] = true;
          }
          return ARCHIVE_FILES.filter(function (f) {
            var queryHit = q && norm(f.label) === q;
            var unlocked =
              !!f.defaultVisible || !!viewedMap[f.id] || !!openedMap[f.id];
            return unlocked || queryHit;
          });
        }

        function findArchiveFileById(id) {
          var sid = String(id || "").trim();
          for (var i = 0; i < ARCHIVE_FILES.length; i++) {
            if (ARCHIVE_FILES[i].id === sid) {
              return ARCHIVE_FILES[i];
            }
          }
          return null;
        }

        function readOpenedArchiveIds() {
          try {
            var raw = localStorage.getItem(OPENED_ARCHIVE_FILES_KEY) || "[]";
            var parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) {
              return [];
            }
            return parsed
              .map(function (x) {
                return String(x || "").trim();
              })
              .filter(Boolean);
          } catch (eRead) {
            return [];
          }
        }

        function writeOpenedArchiveIds(ids) {
          try {
            localStorage.setItem(OPENED_ARCHIVE_FILES_KEY, JSON.stringify(ids));
          } catch (eWrite) {}
        }

        function renderOpenedFileList() {
          if (!openedFileList || !openedFileListEmpty) {
            return;
          }
          openedFileList.innerHTML = "";
          var ids = readOpenedArchiveIds();
          var shown = 0;
          ids.forEach(function (fid) {
            var file = findArchiveFileById(fid);
            if (!file) {
              return;
            }
            shown += 1;
            var li = document.createElement("li");
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "e2-file-link e2-file-link--opened";
            btn.textContent = "(" + shown + ") " + file.label;
            btn.addEventListener("click", function () {
              openFilePreview(file);
            });
            li.appendChild(btn);
            openedFileList.appendChild(li);
          });
          if (shown === 0) {
            openedFileListEmpty.classList.remove("hidden");
          } else {
            openedFileListEmpty.classList.add("hidden");
          }
        }

        function recordArchiveFileOpened(file) {
          if (!file || !file.id) {
            return;
          }
          var ids = readOpenedArchiveIds();
          var sid = file.id;
          if (ids.indexOf(sid) !== -1) {
            return;
          }
          ids.push(sid);
          writeOpenedArchiveIds(ids);
          renderOpenedFileList();
        }

          closeFilePreviewVisual(true);
          if (fileKeywordInput) {
            fileKeywordInput.value = "";
          }
          try {
            window.scrollTo(0, 0);
          } catch (eScroll) {}
          if (archiveLayer) {
            archiveLayer.scrollTop = 0;
          }
          try {
            history.replaceState(null, "", "#archive");
          } catch (eH) {}
          renderFileList();
          renderOpenedFileList();
          if (fileKeywordInput) {
            fileKeywordInput.blur();
          }
        }

        function maybeOpenEnding2Aftermath() {
          var gp = window.GameProgressTracker;
          if (!gp || typeof gp.getShadowBonusPercent !== "function" || typeof gp.resolveUrlWithStage !== "function") {
            return;
          }
          if (!archiveLayer || archiveLayer.classList.contains("hidden")) {
            return;
          }
          if (gp.getShadowBonusPercent() < 100) {
            return;
          }
          try {
            if (sessionStorage.getItem(AFTERMATH_ENTERED_SESSION_KEY) === "1") {
              return;
            }
            sessionStorage.setItem(AFTERMATH_ENTERED_SESSION_KEY, "1");
          } catch (eStore) {}
          var raw = "./015-ending-recap.html";
          window.location.replace(gp.resolveUrlWithStage(raw));
        }

        function renderFileList() {
          var q = norm(fileKeywordInput && fileKeywordInput.value);
          var gp = window.GameProgressTracker;
          var prevShadow =
            gp && typeof gp.getShadowBonusPercent === "function" ? gp.getShadowBonusPercent() : 0;
          if (q && gp && gp.markShadowArchiveFileSearched) {
            ARCHIVE_FILES.forEach(function (file) {
              if (file && SHADOW_MILESTONE_IDS[file.id] && norm(file.label) === q) {
                gp.markShadowArchiveFileSearched(file.id);
              }
            });
          }
          var nextShadow =
            gp && typeof gp.getShadowBonusPercent === "function" ? gp.getShadowBonusPercent() : 0;
          if (nextShadow >= 100 && prevShadow < 100 && q) {
            for (var pi = 0; pi < ARCHIVE_FILES.length; pi++) {
              var pf = ARCHIVE_FILES[pi];
              if (pf && SHADOW_MILESTONE_IDS[pf.id] && norm(pf.label) === q) {
                aftermathPendingMilestoneId = pf.id;
                break;
              }
            }
          }
          var list = getDisplayedCollectedFiles();
          collectedFileList.innerHTML = "";
          if (!list.length) {
            fileListEmpty.classList.remove("hidden");
            return;
          }
          fileListEmpty.classList.add("hidden");
          list.forEach(function (file, idx) {
            var li = document.createElement("li");
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "e2-file-link e2-file-link--collected";
            btn.textContent = "(" + (idx + 1) + ") " + file.label;
            btn.addEventListener("click", function () {
              openFilePreview(file);
            });
            li.appendChild(btn);
            collectedFileList.appendChild(li);
          });
        }

        function openFilePreview(file) {
          filePreviewTitle.textContent = file.label;
          if (file.imageSrc) {
            filePreviewImage.onerror = function () {
              filePreviewImage.onerror = null;
              filePreviewImage.classList.add("hidden");
              filePreviewText.innerHTML =
                "<p>卷宗配图未能加载。请确认已将 media 目录与网页一并部署到服务器，且路径、文件名（含大小写）一致。</p>";
              filePreviewText.classList.remove("hidden");
            };
            filePreviewImage.src = file.imageSrc;
            filePreviewImage.alt = file.imageAlt || file.label;
            filePreviewImage.classList.remove("hidden");
            filePreviewText.classList.add("hidden");
            filePreviewText.textContent = "";
          } else {
            filePreviewImage.onerror = null;
            filePreviewImage.removeAttribute("src");
            filePreviewImage.classList.add("hidden");
            var bodyHtml =
              window.ProseArticle && typeof ProseArticle.formatPlainTextToProseHtml === "function"
                ? ProseArticle.formatPlainTextToProseHtml(file.bodyText)
                : "";
            filePreviewText.innerHTML = bodyHtml || "<p>（无预览内容）</p>";
            filePreviewText.classList.remove("hidden");
          }
          filePreviewBackdrop.classList.remove("hidden");
          filePreviewBackdrop.classList.add("flex");
          filePreviewBackdrop.setAttribute("aria-hidden", "false");
          previewGate = true;
          previewHistoryPushed = false;
          try {
            history.pushState({ gameFilePreview: true }, "", window.location.href);
            previewHistoryPushed = true;
          } catch (ePush) {}
          aftermathNavigateAfterThisClose =
            !!aftermathPendingMilestoneId && file.id === aftermathPendingMilestoneId;
          recordArchiveFileOpened(file);
        }

        function closeFilePreviewVisual(skipEnding2Aftermath) {
          if (!filePreviewBackdrop) {
            return;
          }
          filePreviewBackdrop.classList.add("hidden");
          filePreviewBackdrop.classList.remove("flex");
          filePreviewBackdrop.setAttribute("aria-hidden", "true");
          previewGate = false;
          previewHistoryPushed = false;

          var navigate = aftermathNavigateAfterThisClose;
          aftermathNavigateAfterThisClose = false;
          if (skipEnding2Aftermath) {
            return;
          }

          var gp = window.GameProgressTracker;
          var bonus =
            gp && typeof gp.getShadowBonusPercent === "function" ? gp.getShadowBonusPercent() : 0;
          if (bonus < 100) {
            return;
          }
          if (navigate) {
            aftermathPendingMilestoneId = null;
            maybeOpenEnding2Aftermath();
            return;
          }
          if (aftermathPendingMilestoneId === null) {
            maybeOpenEnding2Aftermath();
          }
        }

        function closeFilePreviewViaHistory() {
          if (previewGate && previewHistoryPushed) {
            try {
              history.back();
            } catch (eBack) {
              closeFilePreviewVisual();
            }
            return;
          }
          closeFilePreviewVisual();
        }

        function openArchiveUI() {
          if (terminalLayer) {
            terminalLayer.classList.add("hidden");
          }
          if (archiveLayer) {
            archiveLayer.classList.remove("hidden");
            archiveLayer.setAttribute("aria-hidden", "false");
          }
          renderFileList();
          renderOpenedFileList();
          if (window.GameProgressTracker && window.GameProgressTracker.refreshProgressUI) {
            window.GameProgressTracker.refreshProgressUI();
          }
        }

        if (homeAfterArchiveBtn) {
          homeAfterArchiveBtn.addEventListener("click", returnToArchiveHome);
        }

        async function runTerminal() {
          terminalLayer.classList.remove("hidden");
          for (var i = 0; i < lines.length; i++) {
            await wait(520 + Math.random() * 380);
            appendLine(lines[i]);
          }
          await wait(700);
          passwordBlock.classList.remove("hidden");
          if (passwordPromptLabel) {
            passwordPromptLabel.classList.remove("hidden");
          }
          await wait(400);
          adminInput.focus();
        }

        document.getElementById("terminalLayer").addEventListener("click", function () {
          if (archiveLayer && !archiveLayer.classList.contains("hidden")) {
            return;
          }
          if (!grantedBlock.classList.contains("hidden")) {
            return;
          }
          adminInput.focus();
        });

        adminInput.addEventListener("input", function () {
          passwordEcho.textContent = adminInput.value;
        });

        adminInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            var v = (adminInput.value || "").trim();
            if (v === CORRECT) {
              passwordFeedback.textContent = "";
              passwordFeedback.className = "e2-pw-feedback e2-pw-feedback--ok";
              passwordFeedback.textContent = "> 校验通过。正在挂载只读卷……";
              adminInput.disabled = true;
              setTimeout(function () {
                passwordBlock.classList.add("hidden");
                grantedBlock.classList.remove("hidden");
              }, 900);
              setTimeout(function () {
                if (grantWait) {
                  grantWait.classList.add("hidden");
                }
                try {
                  sessionStorage.setItem(ARCHIVE_UNLOCKED_KEY, "1");
                  history.replaceState(null, "", "#archive");
                } catch (eStore) {}
                openArchiveUI();
              }, 2200);
            } else {
              passwordFeedback.className = "e2-pw-feedback e2-pw-feedback--err";
              passwordFeedback.textContent = "> AUTHENTICATION FAILED. 请重试。";
            }
          }
        });

        if (fileKeywordInput) {
          fileKeywordInput.addEventListener("input", function () {
            renderFileList();
          });
        }
        if (filePreviewClose) {
          filePreviewClose.addEventListener("click", closeFilePreviewViaHistory);
        }
        if (filePreviewBackdrop) {
          filePreviewBackdrop.addEventListener("click", function (ev) {
            if (ev.target === filePreviewBackdrop) {
              closeFilePreviewViaHistory();
            }
          });
        }
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && filePreviewBackdrop && !filePreviewBackdrop.classList.contains("hidden")) {
            closeFilePreviewViaHistory();
          }
        });

        window.addEventListener("popstate", function () {
          if (previewGate) {
            closeFilePreviewVisual();
          }
        });

        function boot() {
          document.body.classList.add("bg-black");
          try {
            if (sessionStorage.getItem(ARCHIVE_UNLOCKED_KEY) === "1") {
              if (sealLayer) {
                sealLayer.style.display = "none";
              }
              try {
                history.replaceState(null, "", "#archive");
              } catch (eH) {}
              if (terminalLayer) {
                terminalLayer.classList.add("hidden");
              }
              if (grantedBlock) {
                grantedBlock.classList.add("hidden");
              }
              openArchiveUI();
              return;
            }
          } catch (eS) {}
          if (sealLayer) {
            sealLayer.style.display = "";
          }
          setTimeout(function () {
            if (sealCard) {
              sealCard.classList.add("glitch-out");
            }
          }, 4000);
          setTimeout(function () {
            if (sealLayer) {
              sealLayer.style.display = "none";
            }
            runTerminal();
          }, 6500);
        }

        boot();
      })();
    </script>
  </body>
</html>
