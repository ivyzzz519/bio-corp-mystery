<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>检索结果</title>
    <link rel="stylesheet" href="./assets/tailwind.css" />
</head>
  <body class="min-h-screen bg-slate-100 text-slate-700">
    <main class="mx-auto max-w-5xl px-4 py-8">
      <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <a id="backToWorkbenchLink" href="./001-oa-home.html" class="text-xs text-blue-600 hover:underline">< 返回工作台</a>
            <h1 class="mt-2 text-xl font-bold text-slate-800">OA 检索结果</h1>
          </div>
          <div class="flex w-full gap-2 md:w-[460px]">
            <input
              id="oaSearchInput"
              type="text"
              placeholder="输入关键词继续检索"
              class="h-10 flex-1 rounded-lg border border-slate-200 px-3 text-sm outline-none ring-blue-500 transition focus:ring-2"
            />
            <button
              id="oaSearchButton"
              class="h-10 rounded-lg bg-blue-600 px-4 text-sm font-medium text-white"
              type="button"
            >
              搜索
            </button>
          </div>
        </div>
      </div>

      <section class="mt-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="mb-2 flex items-center justify-between">
          <h2 class="text-sm font-semibold text-slate-800">结果列表</h2>
          <p id="resultCount" class="text-xs text-slate-400">显示0条搜索结果</p>
        </div>
        <p id="resultHint" class="text-xs text-slate-500">等待输入关键词...</p>
        <div id="resultList" class="mt-3 space-y-3"></div>
      </section>
    </main>

    <script src="./progressTracker.js"></script>
    <script src="./assets/oaWorkbenchNav.js"></script>
    <script src="./gameData.js"></script>
    <script src="./gameEngine.js"></script>
  </body>
</html>
