<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>无忧云笔记登录</title>
    <link rel="stylesheet" href="./assets/tailwind.css" />
</head>
  <body class="min-h-screen bg-slate-100 text-slate-700">
    <main class="mx-auto flex min-h-screen max-w-5xl items-center justify-center px-4 py-10">
      <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
        <p class="text-xs font-semibold tracking-widest text-slate-400">无忧云笔记</p>
        <h1 class="mt-2 text-2xl font-bold text-slate-900">无忧云笔记</h1>
        <p class="mt-1 text-sm text-slate-500">登录以领取年度 VIP 专属权益</p>

        <div class="mt-6 space-y-3">
          <div>
            <label class="text-xs text-slate-500">账号</label>
            <input class="mt-2 h-10 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none" placeholder="用户名" />
          </div>
          <div>
            <label class="text-xs text-slate-500">密码</label>
            <input type="password" class="mt-2 h-10 w-full rounded-lg border border-slate-200 px-3 text-sm outline-none" placeholder="请输入密码" />
          </div>
          <button class="mt-2 w-full rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white" type="button">
            登录
          </button>
          <a href="./mailbox.html?view=linlan" class="block text-center text-xs text-slate-500 hover:underline">返回邮箱</a>
        </div>
      </section>
    </main>
    <script src="./progressTracker.js"></script>

</html>
